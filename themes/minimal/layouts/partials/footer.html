<footer id="footer">
  <div class="footer-left">
    &copy;
    {{ now.Year }}
    {{ .Site.Params.author | default .Site.Title }}
  </div>
  <div class="footer-right">
    <nav>
      <ul>
        {{- range .Site.Menus.main -}}
          <li><a href="{{ .URL | relLangURL }}">{{ i18n (printf "nav.%s" .Name) | default .Name }}</a></li>
        {{- end -}}
      </ul>
    </nav>
  </div>
</footer>
