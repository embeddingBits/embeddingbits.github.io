baseURL = 'https://embeddingbits.github.io/'
languageCode = 'en-us'
title = "eBits Blog"
theme = 'typo'

googleAnalytics = "G-KP0G8R8WE2"
enableRobotsTXT = true

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Thoughts and Expressions"

# Appearance settings
theme = 'dark'
colorPalette = 'gruvebox'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = "Hi, I'm eBits"
homeIntroContent = """
Hello, I’m Amiitesh, a B.Tech student specializing in Electronics and Computer Engineering 

I spend most of my time messing around with Linux, programming, and exploring systems like operating systems, VLSI, and embedded systems. Apart from tech, I like reading, music, and writing.

I use [Arch Linux](https://archlinux.org) currently and enjoy ricing my setup. You can check out my [dotfiles](https://github.com/embeddingbits/arch_dotfiles). 

I’m also into Free and Open Source Software (FOSS). I like the idea of open collaboration and contribute to my open source projects whenever I could. You can check out some of my [software](https://github.com/embeddingbits/) and software that I use [here](https://embeddingbits.is-a.dev/software).

I write blogs about what I learn, things I find interesting, and ideas I’m experimenting with.

"""

language = 'en'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'
showFooter = true
footerContent = """
Copyright © 2025 Amiitesh TSP.
"""

