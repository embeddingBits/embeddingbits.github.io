# Intro on main page, content is markdown
homeIntroTitle = "Hi, I'm eBits"
homeIntroContent = """
Hi, I’m Amiitesh, an open-source enthusiast and passionate Linux and Neovim user. I love working at the intersection of Embedded Systems, Operating Systems, and Low-Level Programming and VLSI.

I contribute to projects across Embedded Systems, Operating Systems and Systems Programming. I like writing Wayland tools, CLIs and other hobby projects. I write in languages like C, C++, Zig, Python and Golang. When I'm free, I usually write about my thoughts on tech.

Outside tech, I’m a classical pianist and been practicing for the past 10 years.

---
"""

