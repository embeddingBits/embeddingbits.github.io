# Appearance settings
theme = 'dark'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = "Hi, I'm eBits"
homeIntroContent = """
Hi, I’m Amiitesh, I go by `ebits` or `embeddingbits` online. A FOSSpilled Electronics Engineer and a Linux and Neovim/Emacs user. I love working at the intersection of Embedded Systems and VLSI. I also do Operating Systems and other systems programming as a hobby. I program in C/C++, Zig, Verilog and Golang and sometimes Matlab.

Outside tech, I’m a classical pianist, I like to read self-help and philosophy and I write blogs when I find time be it Technical or Non-technical.

-----
"""

language = 'en'

