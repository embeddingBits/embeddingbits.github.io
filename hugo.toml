baseURL = 'https://embeddingbits.is-a.dev/'
locale = 'en-us'
title = "eBits Base"
theme = 'cactus'
enableRobotsTXT = true
enableEmoji = true

[pagination]
pagerSize = 20

[taxonomies]
tag = 'tags'
category = 'categories'

[outputs]
home = ["html", "rss"]

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = 'gruvbox'

# Main menu
[menus]
[[menus.main]]
name = "home"
url = "/"
weight = 1
[[menus.main]]
name = "articles"
url = "/posts/"
weight = 3
[[menus.main]]
name = "my_software"
url = "/my_software/"
weight = 4
[[menus.main]]
name = "tags"
url = "/tags/"
weight = 5

[params]
author = "Amiitesh TSP"
description = """
Hi, I'm <span style="color: #d79921">Amiitesh</span>.

I work with Linux and systems programming. I write C/C++, Golang, Zig cause I hate high level abstractions. I work with low-level systems like embedded systems, operating systems, networks, and I like system design. Apart from tech I like reading, writing blogs and music. I write blogs about things that I find interesting and ideas I'm experimenting with. I mainly post about tech, music, photography and on the books I read.

I like my software *libre* so I'm a **big advocate** of FOSS and I write/contribute to Open Source Software. You can check out some [software](https://codeberg.org/embeddingbits/) that I wrote, [rice](https://codeberg.org/embeddingbits/dotfiles) and software that I use [here](/about/#software-that-i-use).

You can contact me at:
- Mail: tspamiitesh@gmail.com
- Discord - [ebits](https://discord.com/users/1312819280018018374)
"""
dateFormat = '2 Jan 2006'
colorscheme = 'dark'
rss = true

[params.logo]
enabled = true
width = 50
height = 50
url = "/profile.png"
gravatar = false
grayout = false

